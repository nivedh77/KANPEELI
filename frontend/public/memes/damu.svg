<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-damu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121826" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" fill="url(#bg-damu)" rx="24" stroke="#121826" stroke-width="4" />
  
  <!-- Movie Tag -->
  <rect x="24" y="24" width="160" height="32" rx="8" fill="#121826" />
  <text x="104" y="45" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#CEF53D" text-anchor="middle" letter-spacing="1">CHATTAMBINADU</text>

  <!-- Character Avatar Container -->
  <circle cx="200" cy="180" r="100" fill="#fef3c7" stroke="#121826" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Sweat Drops -->
  <path d="M 120 120 C 115 110, 110 125, 120 135 C 130 125, 125 110, 120 120 Z" fill="#38bdf8" stroke="#121826" stroke-width="2" />
  <path d="M 285 130 C 280 120, 275 135, 285 145 C 295 135, 290 120, 285 130 Z" fill="#38bdf8" stroke="#121826" stroke-width="2" />

  <!-- Eyes (Shocked / Wide Open) -->
  <ellipse cx="165" cy="165" rx="26" ry="32" fill="#ffffff" stroke="#121826" stroke-width="3.5" />
  <ellipse cx="235" cy="165" rx="26" ry="32" fill="#ffffff" stroke="#121826" stroke-width="3.5" />
  
  <!-- Eyeballs (Looking Sideways Nervously) -->
  <circle cx="170" cy="168" r="12" fill="#121826" />
  <circle cx="167" cy="164" r="4" fill="#ffffff" />
  <circle cx="240" cy="168" r="12" fill="#121826" />
  <circle cx="237" cy="164" r="4" fill="#ffffff" />

  <!-- Eyelashes (Erratic & Shaking) -->
  <path d="M 142 140 L 138 125 M 155 135 L 152 118 M 170 134 L 170 115 M 185 138 L 189 122" stroke="#121826" stroke-width="3" stroke-linecap="round" />
  <path d="M 215 138 L 211 122 M 230 134 L 230 115 M 245 135 L 248 118 M 258 140 L 262 125" stroke="#121826" stroke-width="3" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 200 175 Q 208 190 200 198" fill="none" stroke="#121826" stroke-width="3.5" stroke-linecap="round" />

  <!-- Iconic Damu Mustache -->
  <path d="M 155 210 Q 180 202 200 212 Q 220 202 245 210 Q 255 224 235 220 Q 200 216 165 220 Q 145 224 155 210 Z" fill="#121826" stroke="#121826" stroke-width="2" />

  <!-- Mouth (O-shaped Trembling) -->
  <ellipse cx="200" cy="235" rx="14" ry="10" fill="#E7583F" stroke="#121826" stroke-width="3" />

  <!-- Red Towel on Shoulder -->
  <path d="M 120 260 Q 90 290 85 340 L 130 350 Q 135 300 150 270 Z" fill="#E7583F" stroke="#121826" stroke-width="3.5" />

  <!-- Character Name Banner -->
  <rect x="30" y="300" width="340" height="76" rx="14" fill="#ffffff" stroke="#121826" stroke-width="3" filter="url(#shadow)" />
  <text x="200" y="332" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#121826" text-anchor="middle">DASHAMOOLAM DAMU</text>
  <text x="200" y="358" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#E7583F" text-anchor="middle">"Enne thallalle... natural peeliya!"</text>
</svg>
