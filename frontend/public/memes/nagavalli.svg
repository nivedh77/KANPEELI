<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-naga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121826" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-naga)" rx="24" stroke="#121826" stroke-width="4" />
  
  <rect x="24" y="24" width="200" height="32" rx="8" fill="#121826" />
  <text x="124" y="45" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#CEF53D" text-anchor="middle" letter-spacing="1">MANICHITRATHAZHU</text>

  <!-- Head -->
  <circle cx="200" cy="175" r="95" fill="#fed7aa" stroke="#121826" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Traditional Hair with Jasmine Flowers -->
  <path d="M 105 160 C 100 80, 160 60, 200 65 C 240 60, 300 80, 295 160 Z" fill="#121826" />
  <circle cx="120" cy="115" r="8" fill="#ffffff" stroke="#121826" stroke-width="2" />
  <circle cx="138" cy="100" r="8" fill="#ffffff" stroke="#121826" stroke-width="2" />
  <circle cx="262" cy="100" r="8" fill="#ffffff" stroke="#121826" stroke-width="2" />
  <circle cx="280" cy="115" r="8" fill="#ffffff" stroke="#121826" stroke-width="2" />

  <!-- Iconic Red Pottu / Bindi -->
  <circle cx="200" cy="120" r="10" fill="#E7583F" stroke="#121826" stroke-width="2" />

  <!-- Enormous Classical Dramatic Almond Eyes -->
  <path d="M 130 165 Q 160 145 190 165 Q 160 185 130 165 Z" fill="#ffffff" stroke="#121826" stroke-width="4" />
  <path d="M 210 165 Q 240 145 270 165 Q 240 185 210 165 Z" fill="#ffffff" stroke="#121826" stroke-width="4" />
  
  <circle cx="160" cy="165" r="10" fill="#121826" />
  <circle cx="240" cy="165" r="10" fill="#121826" />
  
  <!-- Long Extended Winged Kajal & Lashes -->
  <path d="M 190 165 Q 200 155 205 162" stroke="#121826" stroke-width="4" stroke-linecap="round" />
  <path d="M 270 165 Q 280 155 285 162" stroke="#121826" stroke-width="4" stroke-linecap="round" />
  <path d="M 140 152 L 132 135 M 155 148 L 152 130 M 175 150 L 178 132" stroke="#121826" stroke-width="3" stroke-linecap="round" />
  <path d="M 225 150 L 222 132 M 245 148 L 248 130 M 260 152 L 268 135" stroke="#121826" stroke-width="3" stroke-linecap="round" />

  <!-- Intense Smirk -->
  <path d="M 175 225 Q 200 240 225 220" fill="none" stroke="#E7583F" stroke-width="4" stroke-linecap="round" />

  <!-- Bottom Banner -->
  <rect x="30" y="300" width="340" height="76" rx="14" fill="#ffffff" stroke="#121826" stroke-width="3" filter="url(#shadow)" />
  <text x="200" y="332" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#121826" text-anchor="middle">NAGAVALLI</text>
  <text x="200" y="358" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#9333ea" text-anchor="middle">"Vidamaatte? Pure Ocular Drama!"</text>
</svg>
