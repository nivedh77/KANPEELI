<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-shammi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121826" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-shammi)" rx="24" stroke="#121826" stroke-width="4" />
  
  <rect x="24" y="24" width="190" height="32" rx="8" fill="#121826" />
  <text x="119" y="45" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#CEF53D" text-anchor="middle" letter-spacing="1">KUMBALANGI NIGHTS</text>

  <!-- Head -->
  <circle cx="200" cy="175" r="95" fill="#fef3c7" stroke="#121826" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Slick Combed Hair -->
  <path d="M 105 160 C 105 90, 150 70, 200 70 C 250 70, 295 90, 295 160 C 280 120, 240 100, 200 100 C 160 100, 120 120, 105 160 Z" fill="#121826" stroke="#121826" stroke-width="3" />

  <!-- Perfectly Symmetrical Piercing Psycho Eyes -->
  <ellipse cx="160" cy="165" rx="24" ry="24" fill="#ffffff" stroke="#121826" stroke-width="3.5" />
  <ellipse cx="240" cy="165" rx="24" ry="24" fill="#ffffff" stroke="#121826" stroke-width="3.5" />
  
  <!-- Tiny Unblinking Pupils -->
  <circle cx="160" cy="165" r="7" fill="#121826" />
  <circle cx="240" cy="165" r="7" fill="#121826" />

  <!-- Ultra Dense Perfectly Symmetrical Lashes -->
  <path d="M 140 148 L 138 135 M 148 144 L 148 130 M 160 142 L 160 128 M 172 144 L 172 130 M 180 148 L 182 135" stroke="#121826" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 220 148 L 218 135 M 228 144 L 228 130 M 240 142 L 240 128 M 252 144 L 252 130 M 260 148 L 262 135" stroke="#121826" stroke-width="2.5" stroke-linecap="round" />

  <!-- Thin Smug Mustache -->
  <path d="M 165 208 Q 200 204 235 208 Q 210 216 165 208 Z" fill="#121826" />

  <!-- Eerie Mirror Smile -->
  <path d="M 160 225 Q 200 248 240 225" fill="none" stroke="#121826" stroke-width="4" stroke-linecap="round" />

  <!-- Bottom Banner -->
  <rect x="30" y="300" width="340" height="76" rx="14" fill="#ffffff" stroke="#121826" stroke-width="3" filter="url(#shadow)" />
  <text x="200" y="332" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#121826" text-anchor="middle">SHAMMI THE HERO</text>
  <text x="200" y="358" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#059669" text-anchor="middle">"Shammi hero aada... hero!"</text>
</svg>
