<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-manavalan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121826" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-manavalan)" rx="24" stroke="#121826" stroke-width="4" />
  
  <rect x="24" y="24" width="180" height="32" rx="8" fill="#121826" />
  <text x="114" y="45" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#CEF53D" text-anchor="middle" letter-spacing="1">PULIVAL KALYANAM</text>

  <!-- Head -->
  <circle cx="200" cy="175" r="95" fill="#fed7aa" stroke="#121826" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Curly Swag Hair -->
  <path d="M 110 150 C 90 90, 160 60, 200 65 C 250 60, 310 90, 290 150 C 275 110, 230 90, 200 90 C 160 90, 125 115, 110 150 Z" fill="#121826" stroke="#121826" stroke-width="3" />

  <!-- Confident Eyes Peeking Above Sunglasses -->
  <ellipse cx="160" cy="148" rx="20" ry="16" fill="#ffffff" stroke="#121826" stroke-width="3" />
  <ellipse cx="240" cy="148" rx="20" ry="16" fill="#ffffff" stroke="#121826" stroke-width="3" />
  <circle cx="162" cy="148" r="7" fill="#121826" />
  <circle cx="242" cy="148" r="7" fill="#121826" />

  <!-- Extravagant Long Lashes (Dubai Swag) -->
  <path d="M 142 135 L 132 115 M 155 132 L 152 110 M 170 133 L 172 112 M 180 138 L 188 120" stroke="#121826" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 220 138 L 212 120 M 230 133 L 228 112 M 245 132 L 248 110 M 258 135 L 268 115" stroke="#121826" stroke-width="3.5" stroke-linecap="round" />

  <!-- Cool Sunglasses Slid Down Nose -->
  <rect x="130" y="165" width="55" height="34" rx="8" fill="#121826" stroke="#121826" stroke-width="2" />
  <rect x="215" y="165" width="55" height="34" rx="8" fill="#121826" stroke="#121826" stroke-width="2" />
  <path d="M 185 175 L 215 175" stroke="#121826" stroke-width="4" />

  <!-- Wide Proud Tooth Smile -->
  <path d="M 150 220 Q 200 255 250 220 Z" fill="#ffffff" stroke="#121826" stroke-width="3.5" />
  <line x1="200" y1="225" x2="200" y2="242" stroke="#121826" stroke-width="2" />

  <!-- Bottom Banner -->
  <rect x="30" y="300" width="340" height="76" rx="14" fill="#ffffff" stroke="#121826" stroke-width="3" filter="url(#shadow)" />
  <text x="200" y="332" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#121826" text-anchor="middle">MANAVALAN &amp; CO.</text>
  <text x="200" y="358" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#d97706" text-anchor="middle">"Dubai-il ithokke regular peeliya!"</text>
</svg>
